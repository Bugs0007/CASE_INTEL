# Handles ONGOING code updates only. It does not set up a server.
#
# Target: the GCP Compute Engine VM that serves api.caseintel.in.
# The VM must already have: the repo cloned at VM_PROJECT_DIR, a venv in
# .venv, the case-intel (gunicorn) and case-intel-worker systemd units, and a
# sudoers rule that lets VM_USERNAME restart both units without a password.
#
# Required GitHub repository secrets:
#   VM_HOST         public static IP of the VM
#   VM_USERNAME     the Linux user that owns the project folder
#   VM_SSH_KEY      private key of a key pair made only for deploys
#   VM_PROJECT_DIR  optional. Default is ~/CASE_INTEL
name: Deploy to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: deploy-gcp-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            PROJECT_DIR="${{ secrets.VM_PROJECT_DIR }}"
            if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR=~/CASE_INTEL; fi
            cd "$PROJECT_DIR"

            OLD_SHA=$(git rev-parse HEAD)
            git fetch origin
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)
            echo "Deploying $OLD_SHA -> $NEW_SHA"

            source .venv/bin/activate
            pip install -r requirements.txt
            python -m spacy download en_core_web_sm

            python manage.py check
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            sudo systemctl restart case-intel
            sudo systemctl restart case-intel-worker

            # Fail the job if a service did not come back.
            sleep 8
            systemctl is-active --quiet case-intel
            systemctl is-active --quiet case-intel-worker
            echo "Deploy OK at $NEW_SHA"
